services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_tutor_postgres
    environment:
      POSTGRES_DB: ai_tutor_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ai_tutor_postgres_data:/var/lib/postgresql/data

volumes:
  ai_tutor_postgres_data: